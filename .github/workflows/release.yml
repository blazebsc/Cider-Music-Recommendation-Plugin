name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: v$VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.package_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.package_version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.package_version.outputs.version }} does not exist"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.package_version.outputs.version }}" -m "Release ${{ steps.package_version.outputs.version }}"
          git push origin "${{ steps.package_version.outputs.version }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build
        env:
          NODE_ENV: production
          OUTPUT_DIR: dist

      - name: Create release directory
        run: |
          mkdir -p release/music-recommendations
          cp -r dist/* release/music-recommendations/

      - name: Create ZIP file
        run: |
          cd release
          zip -r music-recommendations.zip music-recommendations/
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.check_tag.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.package_version.outputs.version }}
          name: Release ${{ steps.package_version.outputs.version }}
          files: release/music-recommendations.zip
          generate_release_notes: true
          body: |
            ## Installation
            
            1. Download `music-recommendations.zip`
            2. Extract the ZIP file
            3. Copy the `music-recommendations` folder to your Cider plugins directory:
               - **Windows**: `%APPDATA%\Cider\Plugins\`
               - **macOS**: `~/Library/Application Support/Cider/Plugins/`
               - **Linux**: `~/.config/Cider/Plugins/`
            4. Restart Cider
            
            ## What's New
            
            See the full changelog below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
