name: Build Test

on:
  push:
    branches:
      - main
      - dev-main
  pull_request:
    branches:
      - main
      - dev-main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build
        env:
          NODE_ENV: production
          OUTPUT_DIR: dist

      - name: Check build output
        run: |
          ls -la dist/
          echo "Build completed successfully!"
          echo "Files in dist:"
          find dist -type f
